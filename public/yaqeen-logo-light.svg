<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 76" width="320" height="76">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700;900&amp;display=swap');
    .black-title {
      font-family: 'Amiri', 'Traditional Arabic', serif;
      font-size: 38px;
      font-weight: 900;
      fill: #000000;
      letter-spacing: -0.5px;
    }
    .black-sub {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.28em;
      fill: #000000;
    }
    .black-arabic-sub {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 8.5px;
      font-weight: 700;
      fill: #000000;
    }
  </style>

  <!-- All-Black Logo (كل العناصر باللون الأسود النقي 100% للوايت مود) -->
  <g>
    <!-- 1. The Main Arabic Wordmark -->
    <text x="160" y="40" text-anchor="middle" class="black-title">
      يَقِـينُ القُـرْآن
    </text>

    <!-- 2. Solid Black Line & Dot -->
    <line x1="50" y1="50" x2="270" y2="50" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="160" cy="50" r="2" fill="#000000"/>

    <!-- 3. All-Black Subtitle -->
    <text x="160" y="64" text-anchor="middle">
      <tspan class="black-sub">YAQEEN AL-QURAN</tspan>
      <tspan fill="#000000">  •  </tspan>
      <tspan class="black-arabic-sub">نُورٌ وَهُدَى</tspan>
    </text>
  </g>
</svg>
